name: Build clvk on ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git cmake ninja-build build-essential python3 libclang-dev libvulkan-dev glslang-tools

    - name: Clone clvk repository
      run: git clone --recursive https://github.com/kpet/clvk.git

    - name: Fetch clspv dependencies (LLVM)
      run: ./clvk/external/clspv/utils/fetch_sources.py --deps llvm

    - name: Configure with CMake
      run: |
        mkdir clvk/build
        cd clvk/build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

    - name: Build with Ninja
      run: |
        cd clvk/build
        ninja

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: clvk-build
        path: clvk/build/
   
