name: Build clvk on ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build build-essential python3 libclang-dev libvulkan-dev glslang-tools

    - name: Fetch clspv dependencies (LLVM)
      run: ./external/clspv/utils/fetch_sources.py --deps llvm

    - name: Configure with CMake
      run: |
        mkdir build
        cd build
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..

    - name: Build with Ninja
      run: |
        cd build
        ninja

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: clvk-build
        path: build/   
